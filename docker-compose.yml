services:
  postgres:
    image: postgres:16-alpine
    container_name: codexplus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codexplus
      POSTGRES_PASSWORD: codexplus_secret
      POSTGRES_DB: codexplus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
