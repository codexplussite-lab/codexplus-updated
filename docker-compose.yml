version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codexplus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codexfastify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codexfastify
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codexplus-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codexplus_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
      - "127.0.0.1:3000:3000"
    volumes:
      - ./uploads:/app/apps/web/public/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - ADMIN_SEED_EMAIL=admin@codexplus.site
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}
      - API_INTERNAL_URL=http://127.0.0.1:4000/backend
      - UPLOADS_DIR=${UPLOADS_DIR}
    depends_on:
      - postgres
    networks:
      - codexplus-net

volumes:
  postgres_data:

networks:
  codexplus-net:
    driver: bridge
