services:
  postgres:
    image: postgres:16-alpine
    container_name: codexplus-postgres
    restart: always
    environment:
      POSTGRES_USER: codexplus
      POSTGRES_PASSWORD: codexplus_secret
      POSTGRES_DB: codexplus_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
